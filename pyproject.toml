[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lod-attention"
version = "0.1.0"
description = "Production top-four Levels-of-Detail Attention for long-context inference"
readme = "README.md"
requires-python = "==3.12.*"
license = "Apache-2.0"
dependencies = [
  "kernels>=0.16,<0.17",
  "numpy>=1.26",
  "torch>=2.8",
  "transformers==5.15.0",
]

[project.optional-dependencies]
vllm = ["vllm==0.27.1"]
benchmarks = [
  "datasets==4.6.1",
  "lm-eval[ruler]==0.4.12",
  "openai==2.53.0",
]
test = ["pytest>=8.3"]

[project.entry-points."vllm.general_plugins"]
lod_attention = "vllm_lod_plugin.plugin:register"

[tool.hatch.build.targets.wheel]
packages = [
  "benchmarks",
  "lod_attention",
  "integrations/vllm_lod/vllm_lod_plugin",
]

[tool.hatch.build.targets.wheel.force-include]
"integrations/vllm_lod/patches" = "vllm_lod_plugin/patches"

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/benchmarks",
  "/examples",
  "/integrations/vllm_lod/patches",
  "/integrations/vllm_lod/vllm_lod_plugin",
  "/lod_attention",
  "/pyproject.toml",
  "/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
