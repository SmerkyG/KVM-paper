[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vllm-lod-attention"
version = "0.1.0"
description = "Out-of-tree vLLM backend for LOD Attention"
requires-python = ">=3.12"
dependencies = []

[project.entry-points."vllm.general_plugins"]
lod_attention = "vllm_lod_plugin.plugin:register"
weight_cache = "vllm_lod_plugin.weight_cache_loader:register"

[project.scripts]
vllm-weight-cache = "vllm_lod_plugin.weight_cache_daemon:main"

[tool.hatch.build.targets.wheel]
packages = ["vllm_lod_plugin"]
